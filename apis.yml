aid: rows
name: Rows
description: >-
  Rows is an AI-powered spreadsheet that connects to live data from dozens of
  business tools and lets teams build reports, dashboards and lightweight data
  apps without leaving a familiar grid. Beyond the app, Rows ships a public REST
  API (base https://api.rows.com/v1) authenticated with a Bearer API key: it
  exposes workspaces, folders and spreadsheets for discovery, table cell and
  value read-write operations for moving data in and out of a sheet, and a
  Vision endpoint that uses AI to extract structured tabular data from image and
  document files. API access is included on every plan with monthly call quotas
  scaling from the Free tier (500 calls/month) to Enterprise. Rows is SOC 2 Type
  II certified and GDPR compliant with European data residency, and joined
  Superhuman in 2025. It was backed by Accel.
